<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマートフォンで画面幅に合わせて表示するための指定（削除しないでください） -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 【編集】ブラウザのタブや検索結果に表示されるページ名 -->
  <title>屋号が入ります｜サービス名が入ります</title>
  <!-- 【編集】検索結果に表示される説明文（全角80〜120文字程度が目安） -->
  <meta name="description" content="ここにサービスの説明文が入ります。誰に向けて、何を提供しているかを1〜2文で書きます。">

  <link rel="stylesheet" href="css/style.css">
</head>
<!-- id="top"：「ページの先頭へ戻る」リンクの行き先 -->
<body id="top">

  <!-- ===== ヘッダー ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <!-- 【編集】屋号・ロゴ -->
      <a href="#top" class="site-logo">屋号が入ります</a>

      <!-- ページ内メニュー：href="#○○" は、下の各セクションの id="○○" へ移動します -->
      <!-- 【編集】メニュー名（不要なセクションを削除した時は、ここの行も削除） -->
      <nav class="header-nav" aria-label="ページ内メニュー">
        <ul>
          <li><a href="#features">特徴</a></li>
          <li><a href="#pricing">料金</a></li>
          <li><a href="#flow">ご利用の流れ</a></li>
          <li><a href="#faq">よくある質問</a></li>
        </ul>
      </nav>

      <!-- 【編集】ボタンの文字 -->
      <a href="#contact" class="button button-small">お問い合わせ</a>
    </div>
  </header>

  <main>

    <!-- ===== 1. メインビジュアル（サービス紹介） ===== -->
    <section class="section" id="hero">
      <div class="container">
        <h1>キャッチコピーが入ります</h1>
      </div>
    </section>

    <!-- ===== 2. 特徴 ===== -->
    <section class="section" id="features">
      <div class="container">
        <h2>特徴</h2>
      </div>
    </section>

    <!-- ===== 3. 料金 ===== -->
    <section class="section" id="pricing">
      <div class="container">
        <h2>料金</h2>
      </div>
    </section>

    <!-- ===== 4. ご利用の流れ ===== -->
    <section class="section" id="flow">
      <div class="container">
        <h2>ご利用の流れ</h2>
      </div>
    </section>

    <!-- ===== 5. よくある質問 ===== -->
    <section class="section" id="faq">
      <div class="container">
        <h2>よくある質問</h2>
      </div>
    </section>

    <!-- ===== 6. お問い合わせ ===== -->
    <section class="section" id="contact">
      <div class="container">
        <h2>お問い合わせ</h2>
      </div>
    </section>

  </main>

  <!-- ===== フッター ===== -->
  <footer class="site-footer">
    <div class="container">
      <!-- 【編集】年と屋号 -->
      <small>&copy; 2026 屋号が入ります</small>
    </div>
  </footer>

</body>
</html>
